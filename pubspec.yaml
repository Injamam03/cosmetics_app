name: stitch_app
description: Stitch Premium Cosmetics Marketplace

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  get: ^4.6.6

  # Responsive UI
  flutter_screenutil: ^5.9.0
  pin_code_fields: ^8.0.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
